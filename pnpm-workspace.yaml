packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/integrations/*'
catalog:
  react: ^19.0.0
  react-dom: ^19.0.0
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  next: ^15.0.3
  typescript: ^5.6.3
  zod: ^3.25.76
  lucide-react: ^0.468.0
  '@playwright/test': ^1.49.0
  tailwindcss: ^3.4.15
allowBuilds:
  # @prisma/client, @prisma/engines and prisma were removed — grep confirms
  # no package.json in this workspace depends on Prisma, so allow-listing
  # its install scripts was needless attack surface. See 2nd security
  # audit item 22.
  '@sentry/cli': true
  core-js: true
  esbuild: true
  sharp: true
  supabase: true
  unrs-resolver: true
